# Route health recorder, running free on GitHub Actions.
#
# WHY LONG RUNS RATHER THAN A FREQUENT CRON
#
# This used to be a `*/5` cron polling for 260 seconds per run. GitHub does not honour a
# five-minute schedule: measured over 2026-08-17 and 2026-08-18 the real interval was 25 to
# 30 minutes, with a worst gap of 77 minutes. That produced 421 successful polls a day and
# 13.7% of the day actually watched, which is the single biggest limit on what the data can
# say. Non-appearance in particular stays an upper bound rather than a ghost rate while
# most of the day is unobserved.
#
# A GitHub-hosted job may run for six hours, and Actions minutes are free on public
# repositories. Four long runs therefore cover a whole day continuously at no cost, which
# is roughly eight times the polls and near-total coverage.
#
# Each run polls for 5h55m and exits cleanly, five minutes short of the six-hour ceiling so
# the recorder flushes its buffer rather than being killed mid-window. The next run is
# scheduled on the hour it would start anyway; `concurrency` holds it until the outgoing
# run exits, so handover is continuous rather than overlapping. Overlap would not corrupt
# anything — the poller lease permits exactly one — but it would waste a runner.
#
# `recorder-standby.yml` covers the case this cannot: a run that dies early, or a schedule
# GitHub skips entirely. Without it a single missed trigger would be a six-hour hole.
#
# WHY EACH RUN STARTS THE NEXT ONE
#
# Because the schedule above stopped arriving. Between 27 and 29 August 2026 GitHub
# delivered two of the four daily triggers, and watch time fell from 96.7% to 42.3% with a
# longest blind spot of 7h24m. The standby is on a */15 cron, which is 96 triggers a day,
# and it was delivered about three times a day, so the safety net failed in exactly the same
# way as the thing it was protecting. The record then reported the hole as a service
# collapse: every operator appeared to fall together, Dublin Bus from 100% to 38.5%.
#
# A cron is a request. A chain is not: each run dispatches its successor as it exits, so
# continuity depends on the previous run finishing rather than on GitHub's scheduler being
# in a good mood. The cron stays as a cold start for when the chain is broken, and the
# standby stays as the recovery path.
#
# This needs a PAT in `RECORDER_CHAIN_TOKEN`. The built-in GITHUB_TOKEN deliberately cannot
# trigger another workflow run, which is how GitHub prevents workflows looping forever, so
# a dispatch made with it is accepted and then silently produces no run. Without the secret
# this step warns and falls back to the cron.

name: Route health recorder

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

concurrency:
  group: recorder
  cancel-in-progress: false   # never cut a run short mid-window; let it flush

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 358      # 5h58m: the run stops itself at 5h55m, this is the backstop
    steps:
      - uses: actions/checkout@v4

      # routes.txt is all the recorder needs and it is only ~41 KB, but it comes out of a
      # 169 MB archive. Cache it weekly rather than downloading it on every run.
      - id: cache-static
        uses: actions/cache@v4
        with:
          path: server/gtfs/static
          key: gtfs-static-${{ github.run_id }}
          restore-keys: gtfs-static-

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci --omit=dev
        working-directory: server

      - name: Fetch static feed if missing or older than a week
        working-directory: server
        run: |
          if [ ! -f gtfs/static/routes.txt ] || [ -n "$(find gtfs/static/routes.txt -mtime +7 2>/dev/null)" ]; then
            echo "Fetching current GTFS static feed"
            node recorder/fetch-static.js
          else
            echo "Using cached static feed ($(wc -l < gtfs/static/routes.txt) routes)"
          fi

      # Read back by the chain step. A run that dies on startup must not start another.
      - name: Stamp start time
        run: echo "RUN_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - name: Record
        working-directory: server
        env:
          TFI_API_KEY: ${{ secrets.TFI_API_KEY }}
          TFI_TRIP_UPDATES_URL: https://api.nationaltransport.ie/gtfsr/v2/TripUpdates
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: node recorder/recorder.js --duration 21300

      # `always()` so a crashed run still hands over. The whole point is that the chain
      # survives the failure of any single link, and a run that fails after five hours has
      # still earned its successor.
      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.RECORDER_CHAIN_TOKEN }}
        run: |
          elapsed=$(( $(date +%s) - RUN_STARTED ))

          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::RECORDER_CHAIN_TOKEN is not set, so this run cannot start the next one. Falling back to the cron, which is what stopped being delivered."
            exit 0
          fi

          # The guard that makes chaining safe. If a run fails immediately, chaining would
          # spawn another that fails immediately, forever. Ten minutes is far below a
          # healthy run of 5h55m and far above any plausible startup crash, so a real run
          # always chains and a broken one never does. Recovery then falls to the cron and
          # the standby, which is what they are for.
          if [ "$elapsed" -lt 600 ]; then
            echo "::warning::Ran for ${elapsed}s, under the 600s minimum. Not chaining, so a fast-failing run cannot loop. The cron and the standby will recover."
            exit 0
          fi

          echo "Ran for ${elapsed}s. Dispatching the next run."
          gh workflow run recorder.yml --repo "$GITHUB_REPOSITORY"
